<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方向 C · 审片交付台</title>
  <style>
    :root { --ink:#20262d; --muted:#6d7881; --line:#dce3e8; --page:#f3f5f4; --paper:#fff; --teal:#147a6b; --teal-soft:#e3f3ef; --amber:#b66a17; font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif; }
    *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink)} .shell{min-height:100vh;display:grid;grid-template-columns:210px 1fr}.side{padding:24px 18px;background:#e9eeec;border-right:1px solid #d2dcd8}.brand{font-weight:800;font-size:16px}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:500}nav{display:grid;gap:5px;margin-top:34px}nav a{padding:11px 12px;color:#53605e;text-decoration:none;border-radius:6px;font-size:13px}nav a.active{background:#fff;color:var(--teal);font-weight:750;box-shadow:0 1px 4px #18372d12}
    main{width:min(1180px,100%);padding:28px 34px 60px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:20px}.eyebrow{margin-bottom:6px;color:var(--teal);font-size:12px;font-weight:750}h1{margin:0;font-size:26px}.head p{margin:7px 0 0;color:var(--muted);font-size:13px}.head button{min-height:42px;padding:0 15px;border:0;border-radius:6px;background:var(--teal);color:#fff;font-weight:750}
    .filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.filters button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#63706e}.filters button.active{border-color:#9acfc3;background:var(--teal-soft);color:var(--teal);font-weight:700}
    .review-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;padding-top:22px}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.result.selected{border-color:#86c6b9;box-shadow:0 0 0 2px #d2eee8}.result img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.result-body{padding:11px}.result-body strong{display:block;font-size:13px}.result-body small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.decision{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.decision h2{margin:0 0 15px;font-size:16px}.decision-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.decision-row span:last-child{color:var(--muted);text-align:right}.decision-actions{display:grid;gap:8px;margin-top:18px}.decision-actions button{min-height:42px;border-radius:6px;font-weight:700}.approve{border:0;background:var(--teal);color:#fff}.return{border:1px solid #d4b58b;background:#fffaf1;color:var(--amber)}
    .library-strip{display:flex;gap:8px;overflow:auto;padding-top:22px}.library-chip{flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#53605e;font-size:12px}.library-chip.active{border-color:#9acfc3;background:var(--teal-soft);color:var(--teal)}
    @media(max-width:760px){.shell{display:block}.side{padding:15px 16px;border-right:0;border-bottom:1px solid #d2dcd8}nav{display:flex;overflow:auto;margin-top:14px}nav a{white-space:nowrap}main{padding:20px 16px 70px}.head{align-items:start;flex-direction:column}.head button{width:100%}.review-grid{grid-template-columns:1fr}.results{grid-template-columns:1fr 1fr}.decision{order:-1}}
  </style>
</head>
<body><div class="shell"><aside class="side"><div class="brand">衣影工坊<small>AI Creative Studio</small></div><nav><a href="#">制作</a><a href="#">任务</a><a class="active" href="#">审核</a><a href="#">内容库</a></nav></aside><main><div class="head"><div><div class="eyebrow">审片与交付</div><h1>待审核结果</h1><p>先比较结果，再决定是否进入交付，不把生成成功当成合格素材。</p></div><button>打开下一项</button></div><div class="filters"><button class="active">待我处理 3</button><button>已通过 12</button><button>需修改 2</button><button>全部结果</button></div><div class="review-grid"><div class="results"><article class="result selected"><img src="media/look-01.jpg" alt="候选结果一"><div class="result-body"><strong>候选 01 · 完整轮廓</strong><small>技术校验通过 · 等待审核</small></div></article><article class="result"><img src="media/look-02.jpg" alt="候选结果二"><div class="result-body"><strong>候选 02 · 细节镜头</strong><small>技术校验通过 · 等待审核</small></div></article></div><aside class="decision"><h2>审核决定</h2><div class="decision-row"><span>当前状态</span><span>等待人工确认</span></div><div class="decision-row"><span>模板</span><span>服装多镜头展示</span></div><div class="decision-row"><span>交付条件</span><span>审核通过后可下载</span></div><div class="decision-actions"><button class="approve">通过并进入交付</button><button class="return">退回并填写原因</button></div></aside></div><div class="library-strip"><div class="library-chip active">当前品牌 · 春季系列</div><div class="library-chip">模板 · 服装多镜头展示</div><div class="library-chip">动作 · 缓慢侧身</div></div></main></div></body>
</html>
